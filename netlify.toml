# Netlify hosts the live demo: a static build of apps/web.
# The simulation runs in the browser, so no server-side functions are needed.
# Netlify reads the pnpm version from "packageManager" in package.json.

[build]
  base = "/"
  command = "pnpm --filter @cloud-architect/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Vite puts a content hash in every asset file name, so they never change: cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate the page itself so players get new releases straight away.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
