version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directories: [/infra/terraform/envs/dev, /infra/terraform/envs/prod, /infra/terraform/bootstrap]
    schedule:
      interval: monthly
